services:
  mysqldb:
    image: mysql:8.0
    container_name: tracking-order-db
    restart: always
    environment:
      MYSQL_DATABASE: tracking_order
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: tracking-order-app
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysqldb
      - DB_PORT=3306
      - DB_NAME=tracking_order
      - DB_USER=root
      - DB_PASSWORD=password
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - JWT_EXPIRATION=86400000
    depends_on:
      mysqldb:
        condition: service_healthy

volumes:
  mysql_data:
