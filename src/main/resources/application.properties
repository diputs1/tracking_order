spring.application.name=tracking_order

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tracking_order?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Tung@3182003

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# Tắt show-sql của Hibernate (vì nó in thẳng ra stdout, không qua logger)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Logging Configuration
logging.level.com.example.tracking_order=INFO

# Cấu hình log SQL chuẩn Enterprise (thấy SQL + binding params)
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Log execution time của MỌI query (SQL ... took=...ms)
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=0

# Security & JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n


server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

