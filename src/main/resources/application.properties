spring.application.name=tracking_order

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql:replication://localhost:3307,localhost:3308/tracking_order?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
# Tắt show-sql của Hibernate (vì nó in thẳng ra stdout, không qua logger)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Logging Configuration
logging.level.com.example.tracking_order=INFO

# Cấu hình log SQL  (thấy SQL + binding params)
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Log execution time của MỌI query (SQL ... took=...ms)
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=0

# Security & JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n


server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true


# Redis Cache Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=60000

# Request guards
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:100}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.idempotency.enabled=${IDEMPOTENCY_ENABLED:true}
app.idempotency.ttl-hours=${IDEMPOTENCY_TTL_HOURS:24}

# Actuator, metrics, tracing
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
otel.service.name=${spring.application.name}
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
otel.traces.exporter=${OTEL_TRACES_EXPORTER:otlp}
otel.metrics.exporter=none
otel.logs.exporter=none

# Resilience policies
resilience4j.circuitbreaker.instances.notification.sliding-window-size=10
resilience4j.circuitbreaker.instances.notification.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.notification.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notification.wait-duration-in-open-state=30s
resilience4j.retry.instances.notification.max-attempts=3
resilience4j.retry.instances.notification.wait-duration=1s
resilience4j.retry.instances.notification.enable-exponential-backoff=true
resilience4j.retry.instances.notification.exponential-backoff-multiplier=2

# Kafka event bridge is opt-in so the monolith can run without Kafka during Phase A.
app.kafka.enabled=${KAFKA_ENABLED:false}
app.kafka.topics.order-created=${ORDER_CREATED_TOPIC:order.created}
app.kafka.consumer-idempotency-ttl-hours=${KAFKA_CONSUMER_IDEMPOTENCY_TTL_HOURS:168}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:tracking-order-notification}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.tracking_order.modules.order.event
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
